[package]
name = "glabrs"
version = "0.1.0"
edition = "2021"
description = "Lean, fast CLI for self-hosted GitLab"
license = "MIT"
keywords = ["gitlab", "cli", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "glabrs"
path = "src/main.rs"

[lib]
name = "glabrs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ureq = { version = "2", features = ["json", "tls"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rpassword = "7"
tabled = { version = "0.17", features = ["std"] }
url = "2"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json", "tls"] }

[dependencies.thiserror]
version = "2"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
redundant_clone = { level = "warn", priority = 4 }

[profile.release]
lto = true
strip = true
codegen-units = 1
